name: dailyblogger
description: "DailyBlogger — Flutter port of the Android Kotlin app, backed by Supabase."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.5.6
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  go_router: ^14.6.2
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
